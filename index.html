<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>アンケート回答状況</title>
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
<link rel="icon" type="image/png" href="assets/favicon.png">
<link rel="apple-touch-icon" href="assets/favicon.png">
<link rel="stylesheet" href="assets/common.css?v=18">
<script src="assets/config.js?v=18"></script>
<script src="assets/common.js?v=18"></script>
<style>
.role{display:inline-block;font-size:11px;color:#7048b6;border:1px solid #7048b6;border-radius:8px;padding:0 6px;margin-right:4px;line-height:1.6}
.secret-note{display:block;font-size:12px;color:#c53030;margin-top:2px}
@media(min-width:601px){.panel.past .li.c .acts{min-width:100px}}
</style>
</head>
<body>
<header>
  <div class="logo"><svg viewBox="11 5 42 52" aria-hidden="true"><rect x="15" y="12" width="34" height="42" rx="5" fill="#fff"/><rect x="24" y="8" width="16" height="9" rx="3" fill="#fff" stroke="#cf2030" stroke-width="3"/><path d="M22 34 l7 7 l13 -14" fill="none" stroke="#cf2030" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/></svg>Survey Portal</div>
  <div class="center">アンケート回答状況</div>
  <button class="btn gray sm" onclick="load()"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-2.6-6.4L21 8"/><path d="M21 3v5h-5"/></svg>最新にする</button>
</header>
<main id="app"><div class="loading">読み込み中…</div></main>
<div id="layer"></div>

<script>
// ===== 回答する人の画面 =====
// 選んだ名前はこの端末に覚えておき、次からは一覧をすぐに出す
// 前回の一覧と名前の一覧もこの端末に保存しておき、開いた瞬間はそれを出して、裏で最新に差し替える
const ME_KEY = "surveyMe", MEMBERS_KEY = "surveyMembers";
const store = {
  get(k){ try { return JSON.parse(localStorage.getItem(k) || "null"); } catch(e){ return null; } },
  set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} },
  del(k){ try { localStorage.removeItem(k); } catch(e){} },
};
const me = () => store.get(ME_KEY);
const listKey = () => "surveyList:" + me().id;
let updating = false;
const ROWS = [["あ","あいうえお"],["か","かきくけこがぎぐげご"],["さ","さしすせそざじずぜぞ"],["た","たちつてとだぢづでど"],
  ["な","なにぬねの"],["は","はひふへほばびぶべぼぱぴぷぺぽ"],["ま","まみむめも"],["や","やゆよ"],["ら","らりるれろ"],["わ","わをん"]];
let DATA = [];
let showPast = false;

/** 名前を選ぶ画面 */
async function renderPick(){
  const app = document.getElementById("app");
  const cached = store.get(MEMBERS_KEY);
  if(cached) showPick(cached); else app.innerHTML = `<div class="loading">名前の一覧を読み込み中…</div>`;
  try {
    const ms = await call("apiMembers");
    store.set(MEMBERS_KEY, ms);
    if(document.getElementById("who") && document.getElementById("who").value) return; // 選んでいる途中なら差し替えない
    showPick(ms);
  } catch(e) { if(!cached) app.innerHTML = `<div class="empty">読み込みに失敗しました：${esc(errMsg(e))}<br><br><button class="btn" onclick="renderPick()">もう一度読み込む</button></div>`; }
}
/** 名前を選ぶプルダウンを出す */
function showPick(ms){
  const app = document.getElementById("app");
  let sel = '<select id="who"><option value="">お名前を選んでください</option>';
  ROWS.forEach(([label, chars]) => {
    const g = ms.filter(m => chars.includes((m.kana || "")[0]));
    if(g.length) sel += `<optgroup label="${label}行">` + g.map(m => `<option value="${m.id}">${esc(m.name)}</option>`).join("") + "</optgroup>";
  });
  const rest = ms.filter(m => !ROWS.some(([, chars]) => chars.includes((m.kana || "")[0])));
  if(rest.length) sel += `<optgroup label="その他">` + rest.map(m => `<option value="${m.id}">${esc(m.name)}</option>`).join("") + "</optgroup>";
  sel += "</select>";
  app.innerHTML = `<div class="hello">ようこそ<small>はじめに、お名前を選んでください。次回からは自動で表示されます。</small></div>
    <div class="panel">${sel}<button class="btn" onclick="pickMe()">決定</button></div>`;
  window._members = ms;
}
function pickMe(){
  const id = document.getElementById("who").value;
  if(!id){ toast("お名前を選んでください"); return; }
  const m = window._members.find(x => x.id === id);
  store.set(ME_KEY, { id: m.id, name: m.name });
  DATA = [];
  load();
}
function changeMe(){ store.del(ME_KEY); DATA = []; renderPick(); }

/** 一覧を読み込む */
async function load(){
  if(!me()) return renderPick();
  const app = document.getElementById("app");
  if(!DATA.length){ const c = store.get(listKey()); if(c) DATA = c; }
  updating = true;
  if(DATA.length) render(); else app.innerHTML = `<div class="loading">読み込み中…</div>`;
  try {
    DATA = await call("apiMySurveys", me().id);
    store.set(listKey(), DATA);
    updating = false; render();
  } catch(e) {
    updating = false;
    if(DATA.length){ render(); toast("最新の情報を読み込めませんでした。少し待ってから「最新にする」を押してください"); }
    else app.innerHTML = `<div class="empty">読み込みに失敗しました：${esc(errMsg(e))}<br><br><button class="btn" onclick="load()">もう一度読み込む</button></div>`;
  }
}

const byDl = (a, b) => String(a.deadline).localeCompare(String(b.deadline));
/** 回答した日時が新しい順 */
const byAnsweredDesc = (a, b) => String(b.answeredAt).localeCompare(String(a.answeredAt));
/** 役職のタグ（どの役職からのアンケートか） */
const roleTag = s => s.roleName ? `<span class="role">${esc(s.roleName)}</span>` : "";
/** タイトルの下に出す補足（役職のタグ、班ごとなら「A01班として」など） */
function sub(s){
  let text = "";
  const missed = s.status === "締め切り" && s.state === "未回答";
  if(s.unit === "班ごと" && missed){
    text = `${esc(s.han)}班として回答するアンケートでした`;
  } else if(s.unit === "班ごと"){
    text = s.state === "回答済み" ? `${esc(s.han)}班として回答済み（${esc(s.answeredBy)}さんが回答）`
      : `${esc(s.han)}班として回答します（班の誰か1人が答えればOK）`;
  }
  const lock = s.secret && !missed ? `<span class="secret-note">${ic("lock")}回答は管理者だけが見られます</span>` : "";
  return (s.roleName || text || lock) ? `<small>${roleTag(s)}${text}${lock}</small>` : "";
}
function render(){
  const list = DATA.filter(s => s.state !== "対象外（退会）");
  const todo = list.filter(s => s.status === "受付中" && s.state === "未回答").sort(byDl);
  const doneOpen = list.filter(s => s.status === "受付中" && s.state === "回答済み").sort(byAnsweredDesc);
  const past = list.filter(s => s.status === "締め切り" && (s.state === "回答済み" || s.state === "未回答"));
  const pastMiss = past.filter(s => s.state === "未回答").length;
  const first = me().name.split(/[\s　]/)[0];
  const row = (s, open) => `<div class="li r3">
      <div class="t">${esc(s.title)}${sub(s)}</div>
      <div class="dl">締め切り ${fmtDl(s.deadline)}${open ? leftHtml(s.deadline) : ""}</div>
      <div class="at">回答 ${fmt(s.answeredAt)}${s.edited ? '<span class="edited">修正済み</span>' : ""}</div>
      <div class="acts">${s.secret
        ? (open && s.formUrl ? `<button class="mini" onclick="redoMine('${s.id}')">答え直す</button>` : "")
        : `<button class="mini gray" onclick="viewMine('${s.id}')">回答を見る</button>${open && s.editUrl ? `<button class="mini" onclick="editMine('${s.id}')">修正する</button>` : ""}`}</div></div>`;

  let h = `<div class="hello">こんにちは ${esc(first)}さん
    <small>あなたではない場合は <a href="#" onclick="changeMe();return false;">名前を選び直す</a>${updating ? '　<span class="muted">最新の情報を確認中…</span>' : ""}</small></div>
    <div class="panel"><h2>${ic("pencil")}まだ答えていないアンケート（${todo.length}件）</h2>`;
  h += todo.length ? `<p class="sec-note">締め切りが近い順に並んでいます</p><div class="list">` + todo.map(s => `<div class="li r1">
      <div class="t">${esc(s.title)}${sub(s)}</div>
      <div class="dl">締め切り ${fmtDl(s.deadline)}${leftHtml(s.deadline)}</div>
      <div class="acts"><button class="mini" onclick="answer('${s.id}')">回答する</button></div></div>`).join("") + `</div>`
    : `<div class="empty">すべて回答済みです。ありがとうございます！</div>`;
  h += `</div>`;
  if(doneOpen.length) h += `<div class="panel done"><h2>${ic("check")}回答済み・締め切り前（${doneOpen.length}件）</h2>
      <p class="sec-note">新しく回答した順に並んでいます。締め切りまでは回答を修正・答え直しできます</p><div class="list">${doneOpen.map(s => row(s, true)).join("")}</div></div>`;
  if(past.length) h += `<div class="panel past"><details ${showPast ? "open" : ""} ontoggle="showPast=this.open"><summary><span>${ic("lock")}締め切り済み（${past.length}件${pastMiss ? `・<span class="past-miss">うち未回答 ${pastMiss}件</span>` : ""}）</span></summary>
      <div class="in">${toolHtml()}<div id="pastList">${pastListHtml()}</div></div></details></div>`;
  h += `<p class="muted" style="text-align:center">回答を送ったあと、この画面に戻ると「回答済み」に変わります（反映まで1分ほどかかることがあります）</p>`;
  document.getElementById("app").innerHTML = h;
}
const find = id => DATA.find(s => s.id === id);

// ----- 締め切り済みの一覧（検索・絞り込み・並び替えは、作る人の画面の締め切り済みと同じ形） -----
const P0 = () => ({ kw: "", st: "", sort: "deadline", dir: "desc" });
let P = P0(), showFilt = false;
const PAST_SORT = { deadline: "締め切り", title: "アンケート名", state: "未回答を先に" };
function pastRows(){
  let rows = DATA.filter(s => s.status === "締め切り" && (s.state === "回答済み" || s.state === "未回答"));
  const kw = P.kw.trim();
  if(kw) rows = rows.filter(s => s.title.includes(kw));
  if(P.st) rows = rows.filter(s => s.state === P.st);
  const ja = (a, b) => a.title.localeCompare(b.title, "ja", { numeric: true });
  const by = {
    deadline: (a, b) => String(a.deadline).localeCompare(String(b.deadline)) || ja(a, b),
    title: ja,
    state: (a, b) => (a.state === "未回答" ? 0 : 1) - (b.state === "未回答" ? 0 : 1) || String(b.deadline).localeCompare(String(a.deadline)),
  };
  rows.sort(by[P.sort] || by.deadline);
  if(P.dir === "desc" && P.sort !== "state") rows.reverse();
  return rows;
}
/** 締め切り済みの1行。左に「回答済み／未回答」のタグ、未回答の行は赤く目立たせる */
function pastRowHtml(s){
  const miss = s.state === "未回答";
  return `<div class="li c${miss ? " miss" : ""}">
      <div class="tg">${miss ? '<span class="tag miss">未回答</span>' : '<span class="tag done">回答済み</span>'}</div>
      <div class="t">${esc(s.title)}${sub(s)}</div>
      <div class="prog pr">${miss ? "締め切りまでに回答がありませんでした" : `回答 ${fmt(s.answeredAt)}${s.edited ? '<span class="edited">修正済み</span>' : ""}`}</div>
      <div class="dl">締め切り ${fmtDl(s.deadline)}</div>
      <div class="acts">${!miss && !s.secret ? `<button class="mini gray" onclick="viewMine('${s.id}')">回答を見る</button>` : ""}</div></div>`;
}
const monthOfDl = s => { const m = String(s.deadline).match(/^(\d{4})-(\d{2})/); return m ? `${m[1]}年${Number(m[2])}月締め切り` : "締め切り日なし"; };
function pastListHtml(){
  const rows = pastRows(), all = DATA.filter(s => s.status === "締め切り" && (s.state === "回答済み" || s.state === "未回答")).length;
  let h = `<p class="hit">該当 <b>${rows.length}</b> / ${all}件</p>`;
  if(!rows.length) return h + `<div class="empty">条件に合うアンケートはありません</div>`;
  if(P.sort === "deadline"){
    const groups = [];
    rows.forEach(s => { const m = monthOfDl(s); const g = groups[groups.length - 1]; if(g && g.m === m) g.rows.push(s); else groups.push({ m: m, rows: [s] }); });
    return h + groups.map(g => `<div class="month">${esc(g.m)}<small>${g.rows.length}件</small></div><div class="list">${g.rows.map(pastRowHtml).join("")}</div>`).join("");
  }
  return h + `<div class="list">${rows.map(pastRowHtml).join("")}</div>`;
}
function toolHtml(){
  return `<div class="tool">
      <div class="search">${ic("search")}<input placeholder="アンケート名で検索" value="${esc(P.kw)}" oninput="P.kw=this.value;updatePast()"></div>
      <button id="filtBtn" class="btn gray sm filtbtn${showFilt ? " on" : ""}" onclick="showFilt=!showFilt;updatePast()">${filtBtnLabel()}</button>
    </div><div id="filtBox">${filtBoxHtml()}</div>`;
}
function filtCount(){ const d = P0(); return (P.st ? 1 : 0) + (P.sort !== d.sort || P.dir !== d.dir ? 1 : 0); }
function filtBtnLabel(){ const n = filtCount(); return `${ic("sliders")}絞り込み<span class="wide">・並び替え</span>${n ? `<span class="fc">${n}</span>` : ""}${showFilt ? ic("up") : ic("down")}`; }
function filtBoxHtml(){
  if(!showFilt) return "";
  const o = (v, t, cur) => `<option value="${v}" ${cur === v ? "selected" : ""}>${t}</option>`;
  return `<div class="filtbox">
    <label>回答状況<select onchange="P.st=this.value;updatePast()">${o("", "すべて", P.st)}${o("未回答", "未回答だけ", P.st)}${o("回答済み", "回答済みだけ", P.st)}</select></label>
    <label>並び順<select onchange="P.sort=this.value;updatePast()">${Object.keys(PAST_SORT).map(k => o(k, PAST_SORT[k], P.sort)).join("")}</select></label>
    ${P.sort !== "state" ? `<button class="btn gray sm" onclick="P.dir=P.dir==='asc'?'desc':'asc';updatePast()">${P.dir === "asc" ? ic("arrowUp") + "昇順" : ic("arrowDown") + "降順"}</button>` : ""}
    ${filtCount() || P.kw ? `<a href="#" class="clr" onclick="P=P0();render();return false;">× 条件をクリア</a>` : ""}
  </div>`;
}
/** 締め切り済みの一覧とボタンだけを書き直す（検索欄は書き直さないので、入力中でも途切れない） */
function updatePast(){
  const btn = document.getElementById("filtBtn"), box = document.getElementById("filtBox"), list = document.getElementById("pastList");
  if(btn){ btn.innerHTML = filtBtnLabel(); btn.classList.toggle("on", showFilt); }
  if(box) box.innerHTML = filtBoxHtml();
  if(list) list.innerHTML = pastListHtml();
}

// ----- フォームを別ウィンドウで開く -----
// フォームは横に小さい別ウィンドウで開く。閉じるか「回答を終えて戻る」を押すと、この画面に戻って一覧を最新にする。
// スマホなどでウィンドウを止められたときは、別タブで開く（戻ってきたら自動で最新になる）。
let formWin = null, formTimer = null;
function openFormWin(url, title, mode){
  const w = Math.min(760, Math.round(screen.availWidth * 0.6)), h = Math.round(screen.availHeight * 0.9);
  const left = screen.availWidth - w, top = 0;
  formWin = window.open(url, "surveyAnswer", `popup=yes,width=${w},height=${h},left=${left},top=${top}`);
  if(!formWin){ window.open(url, "_blank"); return; }
  formWin.focus();
  modal(`<h3 style="margin-top:0">${ic("pencil")}${mode === "edit" ? "回答を修正中" : "回答中"}</h3>
    <p><b>${esc(title)}</b></p>
    <p>開いたウィンドウでフォームに答えて、<b>「送信」を押してください</b>。送信したら、ウィンドウを閉じるか、下のボタンを押すとこの画面に戻ります。</p>
    <button class="btn gray" onclick="formWin && formWin.focus()">フォームを前に出す</button>
    <button class="btn" onclick="finishForm()">回答を終えて戻る</button>`);
  clearInterval(formTimer);
  formTimer = setInterval(() => { if(!formWin || formWin.closed) finishForm(); }, 800);
}
function finishForm(){
  clearInterval(formTimer); formTimer = null;
  try { if(formWin && !formWin.closed) formWin.close(); } catch(e){}
  formWin = null;
  modal(`<h3 style="margin-top:0">${ic("check")}おつかれさまでした</h3>
    <p>送信した回答は、1分ほどで「回答済み」に変わります。</p>
    <button class="btn" onclick="closeModal()">一覧に戻る</button>`);
  load();
  setTimeout(load, 60000);  // 反映に時間がかかったときのために、1分後にもう一度最新にする
}

/** 名前が入った状態でフォームを開く */
function answer(id){
  const s = find(id);
  openFormWin(s.formUrl, s.title, "answer");
}
/** 修正用のリンクを開く（班ごとのときは名前を変えてもらう案内を出す） */
function editMine(id){
  const s = find(id);
  if(s.unit === "班ごと"){
    modal(`<h3 style="margin-top:0">${esc(s.title)}</h3>
      <p>班の回答を修正します。開いたフォームの<b>「お名前」をご自身のお名前に変えてから</b>送信してください。誰が修正したかを記録するためです。</p>
      <button class="btn" onclick="openFormWin(find('${s.id}').editUrl, find('${s.id}').title, 'edit')">修正画面を開く</button>
      <button class="btn gray" onclick="closeModal()">キャンセル</button>`);
  } else openFormWin(s.editUrl, s.title, "edit");
}
/** 回答を非公開にしているアンケートを、空のフォームから答え直す（いちばん新しい送信が答えになる） */
function redoMine(id){
  const s = find(id);
  modal(`<h3 style="margin-top:0">${esc(s.title)}</h3>
    <p>このアンケートの回答は管理者だけが見られるため、前の答えを開いて直すことはできません。</p>
    <p><b>最初からもう一度答えて送信してください。</b>新しく送った答えが、${s.unit === "班ごと" ? esc(s.han) + "班の" : "あなたの"}回答になります。</p>
    <button class="btn" onclick="openFormWin(find('${s.id}').formUrl, find('${s.id}').title, 'answer')">答え直す</button>
    <button class="btn gray" onclick="closeModal()">キャンセル</button>`);
}
/** 自分（自分の班）の回答を見る */
async function viewMine(id){
  const s = find(id);
  modal(`<h3 style="margin-top:0">${esc(s.title)}</h3><div class="loading">読み込み中…</div>`);
  try {
    const qa = await call("apiMyAnswer", s.id, s.responseId);
    modal(`<h3 style="margin-top:0">${esc(s.title)}</h3>
      <p class="muted">${roleTag(s)}${s.unit === "班ごと" ? esc(s.han) + "班の回答" : "あなたの回答"}（${fmt(s.answeredAt)}${s.edited ? "・修正済み" : ""}）</p>
      ${qa.length ? qa.map(x => `<div class="q"><div class="ql">${esc(x.q)}</div><div class="ans">${esc(x.a)}</div></div>`).join("") : '<p class="muted">お名前以外の質問はありません</p>'}
      ${s.status === "受付中" && s.editUrl ? `<button class="btn" onclick="editMine('${s.id}')">修正する</button> ` : `<p class="muted">締め切り済みのため修正できません。</p>`}
      <button class="btn gray" onclick="closeModal()">閉じる</button>`);
  } catch(e) { modal(`<p>読み込みに失敗しました：${esc(errMsg(e))}</p><button class="btn gray" onclick="closeModal()">閉じる</button>`); }
}
// 別タブで答えて戻ってきたときも、自動で最新にする
document.addEventListener("visibilitychange", () => { if(document.visibilityState === "visible" && me() && !formWin) load(); });
load();
</script>
</body>
</html>
