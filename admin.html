<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>アンケート管理</title>
<link rel="stylesheet" href="assets/common.css?v=3">
<script src="assets/config.js?v=3"></script>
<script src="assets/common.js?v=3"></script>
<style>
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 16px;align-items:center}
.tabs button{background:#fff;border:1px solid var(--line);color:#555;border-radius:18px;padding:8px 16px;font-size:14px;cursor:pointer;font-family:inherit}
.tabs button.on{background:var(--red);border-color:var(--red);color:#fff;font-weight:bold}
.tabs button small{margin-left:4px;opacity:.8}
.kibar{display:flex;align-items:center;gap:8px;margin:0 0 12px}
.kibar select{width:auto;margin:0;padding:8px 10px}
.kibar .now{font-size:12px;color:#777}
#createBtn:disabled{background:#bbb;border-color:#bbb;color:#fff;cursor:not-allowed;opacity:1}
.req{font-size:11px;color:var(--red);margin-left:2px}
.need{color:var(--red);font-size:13px;margin:0 0 8px}
.blank{background:#fff9db !important}
.done-url{word-break:break-all;background:#f6f6f6;border-radius:8px;padding:10px;font-size:13px;margin:8px 0 14px}
.role{display:inline-block;font-size:11px;color:#7048b6;border:1px solid #7048b6;border-radius:8px;padding:0 6px;margin-right:4px}
.ki{display:inline-block;font-size:11px;color:#2f855a;border:1px solid #2f855a;border-radius:8px;padding:0 6px;margin-right:4px}
.actmenu{position:fixed;z-index:50;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 6px 20px rgba(0,0,0,.15);padding:6px 0;min-width:200px}
.actmenu button{display:block;width:100%;text-align:left;background:none;border:0;padding:9px 16px;font-size:14px;font-family:inherit;color:#333;cursor:pointer}
.actmenu button:hover{background:#f4f4f4}
.actmenu button.danger{color:var(--red)}
.actmenu hr{border:0;border-top:1px solid var(--line);margin:4px 0}
.month{font-weight:bold;color:#555;font-size:14px;margin:16px 0 6px;padding-bottom:4px;border-bottom:2px solid var(--line)}
.month small{font-weight:normal;color:#888;margin-left:6px}
.chk{display:flex;align-items:center;gap:8px;font-size:14px;color:#333;margin:6px 0 12px;cursor:pointer}
.chk input{width:auto;margin:0}
.guest{display:inline-block;font-size:11px;color:#b7791f;border:1px solid #b7791f;border-radius:8px;padding:0 6px;margin-right:4px}
.secret{display:inline-block;font-size:11px;color:#c53030;border:1px solid #c53030;border-radius:8px;padding:0 6px;margin-right:4px}
.unit{display:inline-block;font-size:11px;color:#4a5568;border:1px solid #4a5568;border-radius:8px;padding:0 6px;margin-right:4px}
.csv-box{width:100%;height:160px;font-size:12px;font-family:monospace;white-space:pre;margin:8px 0 12px}
.tile .lb{font-size:16px;font-weight:bold;color:#222;padding-bottom:8px;margin-bottom:6px;border-bottom:1px solid var(--line)}
#remindBox{width:100%;min-height:200px;line-height:1.6;font-size:14px;box-sizing:border-box;font-family:inherit}
</style>
</head>
<body>
<header>
  <div class="logo">📋 Survey Portal</div>
  <div class="center">アンケート管理</div>
  <button class="btn gray sm" onclick="view=null;load()">↻ 最新にする</button>
</header>
<main id="app"><div class="loading">読み込み中…</div></main>
<div id="layer"></div>

<script>
// ===== 作る人の画面 =====
const PASS_KEY = "surveyPass", AUTHOR_KEY = "surveyAuthor", LIST_KEY = "surveyAdminList", ROLES_KEY = "surveyRoles", TAB_KEY = "surveyRoleTab", REMIND_KEY = "surveyRemind";
const store = {
  get(k){ try { return JSON.parse(localStorage.getItem(k) || "null"); } catch(e){ return null; } },
  set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} },
};
const REMIND_DEFAULT = "【リマインド】「{タイトル}」が未回答です（締め切り：{締め切り}）。\n{名前}\nお手すきの際にご回答をお願いします！";
let REMIND = store.get(REMIND_KEY) || REMIND_DEFAULT;

// ----- 期（4月1日と10月1日で1つ上がる。2026年10月1日〜が29期） -----
function kiOfDate(v){
  let d = v ? new Date(/^\d{4}-\d{2}-\d{2}$/.test(String(v)) ? v + "T00:00:00" : v) : new Date();
  if(isNaN(d)) d = new Date();
  const y = d.getFullYear(), m = d.getMonth() + 1;
  const idx = m >= 10 ? y * 2 + 1 : m >= 4 ? y * 2 : (y - 1) * 2 + 1;
  return 29 + idx - (2026 * 2 + 1);
}
const CUR_KI = kiOfDate(null);
let kiView = CUR_KI;
const kiOf = s => Number(s.ki) || kiOfDate(s.createdAt || s.deadline);

let updating = false;
const pass = () => sessionStorage.getItem(PASS_KEY) || "";
let DATA = [];
let ROLES = store.get(ROLES_KEY) || [];
let tab = store.get(TAB_KEY) || "all";
let view = null;
let showClosed = false;
const L0 = () => ({ kw: "", rt: "", dl: "", open: { sort: "deadline", dir: "asc" }, closed: { sort: "created", dir: "desc" } });
let L = L0();
const SORT_LABEL = { created: "作成日", deadline: "締め切り", title: "アンケート名", rate: "回答状況" };
const rate = s => s.total ? Math.round(s.answered / s.total * 100) : 0;
const isClosed = s => s.status === "締め切り";
const roleName = id => (ROLES.find(r => r.id === id) || {}).name || "";
const activeRoles = () => ROLES.filter(r => r.active);
const createdOf = s => String(s.createdAt || s.deadline || "");
function monthOf(s){
  const v = createdOf(s);
  if(!v) return "日付なし";
  const d = /^\d{4}-\d{2}-\d{2}$/.test(v) ? new Date(v + "T00:00:00") : new Date(v);
  return isNaN(d) ? "日付なし" : `${d.getFullYear()}年${d.getMonth() + 1}月`;
}
const inTab = s => tab === "all" ? true : tab === "none" ? !s.roleId || !roleName(s.roleId) : s.roleId === tab;
const inKi = s => kiView === "all" || kiOf(s) === Number(kiView);
const shown = () => DATA.filter(s => inTab(s) && inKi(s));

// ----- 入口（合言葉） -----
function renderLogin(msg){
  document.getElementById("app").innerHTML = `<div class="hello">アンケート管理<small>合言葉を入れてください。</small></div>
    <div class="panel"><input id="pw" type="password" placeholder="合言葉" onkeydown="if(event.key==='Enter')login()">
    ${msg ? `<p style="color:var(--red)">${esc(msg)}</p>` : ""}<button class="btn" onclick="login()">入る</button></div>`;
  document.getElementById("pw").focus();
}
async function login(){
  const pw = document.getElementById("pw").value;
  if(!pw){ toast("合言葉を入れてください"); return; }
  const r = await call("apiLogin", pw).catch(() => ({ ok: false }));
  if(!r.ok) return renderLogin("合言葉が違います");
  sessionStorage.setItem(PASS_KEY, pw);
  load();
}
async function api(fn){
  const args = Array.prototype.slice.call(arguments, 1);
  try { return await call.apply(null, [fn, pass()].concat(args)); }
  catch(e){ if(/合言葉/.test(errMsg(e))){ sessionStorage.removeItem(PASS_KEY); renderLogin("合言葉を入れ直してください"); } throw e; }
}

// ----- 一覧 -----
async function load(){
  if(!pass()) return renderLogin();
  if(!DATA.length){ const c = store.get(LIST_KEY); if(c) DATA = c; }
  updating = true;
  if(DATA.length){ if(!view) render(); } else document.getElementById("app").innerHTML = `<div class="loading">読み込み中…</div>`;
  api("apiRemindTemplate").then(t => { if(t){ REMIND = t; store.set(REMIND_KEY, t); } }).catch(() => {});
  try {
    const res = await Promise.all([api("apiAdminList"), api("apiRoles")]);
    DATA = res[0]; ROLES = res[1];
    store.set(LIST_KEY, DATA); store.set(ROLES_KEY, ROLES);
    if(tab !== "all" && tab !== "none" && !ROLES.some(r => r.id === tab)) setTab("all", true);
    updating = false;
    if(!view) render();
  } catch(e){
    updating = false;
    if(!pass()) return;
    if(DATA.length){ if(!view) render(); toast("最新の一覧を読み込めませんでした。少し待ってから「最新にする」を押してください"); }
    else document.getElementById("app").innerHTML = `<div class="empty">読み込みに失敗しました：${esc(errMsg(e))}<br><br><button class="btn" onclick="load()">もう一度読み込む</button></div>`;
  }
}
function setTab(t, silent){
  tab = t; store.set(TAB_KEY, t);
  const el = document.getElementById("role");
  if(el) el.value = (t !== "all" && t !== "none") ? t : "";
  if(!silent) render();
}
function setKiView(v){ kiView = v === "all" ? "all" : Number(v); render(); }
async function reloadMaster(){
  modal(`<div class="loading">Notionからメンバー・班・役職を読み直しています…</div>`);
  try {
    const r = await api("apiReloadMaster");
    closeModal();
    toast(`読み直しました（在籍中 ${r.members}名・班 ${r.hans}件・役職 ${r.roles}件）`);
    load();
  } catch(e){ modal(`<p>読み直しに失敗しました：${esc(errMsg(e))}</p><button class="btn gray" onclick="closeModal()">閉じる</button>`); }
}
function keepInputs(){
  const v = {};
  ["ttl", "dl", "pub", "unit", "author", "role", "kiSel"].forEach(k => { const el = document.getElementById(k); if(el) v[k] = el.value; });
  return v;
}
function restoreInputs(v){
  Object.keys(v).forEach(k => { const el = document.getElementById(k); if(el && v[k] !== undefined && v[k] !== "") el.value = v[k]; });
}
function render(){
  if(view) return renderDetail(view);
  const kept = keepInputs();
  renderList();
  restoreInputs(kept);
  checkReady();
}
function missingItems(){
  const v = k => (document.getElementById(k) || {}).value || "";
  const miss = [];
  if(!v("ttl").trim()) miss.push("タイトル");
  if(!v("dl")) miss.push("締め切り");
  if(!v("unit")) miss.push("回答の単位");
  if(ROLES.length && !v("role")) miss.push("役職");
  if(!v("author").trim()) miss.push("作成者");
  return miss;
}
function checkReady(){
  const btn = document.getElementById("createBtn"), msg = document.getElementById("needMsg");
  if(!btn) return;
  const miss = missingItems();
  const names = { ttl: "タイトル", dl: "締め切り", unit: "回答の単位", role: "役職", author: "作成者" };
  Object.keys(names).forEach(k => { const el = document.getElementById(k); if(el) el.classList.toggle("blank", miss.includes(names[k])); });
  btn.disabled = miss.length > 0;
  if(msg){ msg.style.display = miss.length ? "" : "none"; msg.textContent = "必要事項をすべて入力してください（未入力：" + miss.join("・") + "）"; }
}
function roleSelect(id, selected, onchg){
  return `<select id="${id}"${onchg ? ` onchange="${onchg}"` : ""}><option value="">（役職を選ばない）</option>` +
    activeRoles().map(r => `<option value="${r.id}" ${r.id === selected ? "selected" : ""}>${esc(r.name)}</option>`).join("") + `</select>`;
}
function kiSelect(id, selected){
  const sel = Number(selected) || CUR_KI;
  const opts = [CUR_KI - 1, CUR_KI, CUR_KI + 1];
  if(opts.indexOf(sel) < 0) opts.push(sel);
  return `<select id="${id}">` + opts.sort((a, b) => a - b).map(k =>
    `<option value="${k}" ${k === sel ? "selected" : ""}>${k}期${k === CUR_KI ? "（今期）" : k === CUR_KI + 1 ? "（次の期）" : k === CUR_KI - 1 ? "（前の期）" : ""}</option>`).join("") + `</select>`;
}
function kiBarHtml(){
  const kis = {};
  DATA.forEach(s => { kis[kiOf(s)] = true; });
  kis[CUR_KI] = true;
  const list = Object.keys(kis).map(Number).sort((a, b) => b - a);
  return `<div class="kibar"><label style="margin:0">表示する期</label>
    <select onchange="setKiView(this.value)">
      ${list.map(k => `<option value="${k}" ${kiView === k ? "selected" : ""}>${k}期${k === CUR_KI ? "（今期）" : ""}</option>`).join("")}
      <option value="all" ${kiView === "all" ? "selected" : ""}>すべての期</option>
    </select><span class="now">今期は${CUR_KI}期です</span></div>`;
}
function tabsHtml(){
  if(!ROLES.length) return "";
  const cnt = f => DATA.filter(s => inKi(s) && !isClosed(s) && f(s)).length;
  const b = (t, label, n) => `<button class="${tab === t ? "on" : ""}" onclick="setTab('${t}')">${esc(label)}<small>${n}</small></button>`;
  let h = `<div class="tabs">` + b("all", "すべて", cnt(() => true));
  activeRoles().forEach(r => { h += b(r.id, r.name, cnt(s => s.roleId === r.id)); });
  const none = cnt(s => !s.roleId || !roleName(s.roleId));
  if(none || tab === "none") h += b("none", "未設定", none);
  return h + `</div>`;
}
function renderList(){
  const list = shown();
  const closedN = list.filter(isClosed).length;
  const cur = DATA.filter(s => inTab(s) && kiOf(s) === CUR_KI);
  const curOpen = DATA.filter(s => inTab(s) && s.status === "受付中");
  const curClosedN = cur.filter(isClosed).length;
  const notAll = curOpen.filter(s => s.total > 0 && s.answered < s.total).length;
  const o = (v, t, c) => `<option value="${v}" ${c === v ? "selected" : ""}>${t}</option>`;
  const tabName = tab === "all" ? "" : tab === "none" ? "役職が未設定の" : roleName(tab) + "の";
  const kiName = kiView === "all" ? "すべての期" : kiView + "期";
  document.getElementById("app").innerHTML = `<div class="hello">アンケート管理<small>対象者は公開した時点で「在籍中」のメンバーに固定されます。${updating ? '　<span class="muted">最新の情報を確認中…</span>' : ""}</small></div>
    ${kiBarHtml()}
    ${tabsHtml()}
    <div class="panel"><h2>新しいアンケートを作る</h2>
      <div class="form-grid">
        <div><label>タイトル <span class="req">必須</span></label><input id="ttl" placeholder="例：11月 定例会の満足度アンケート" oninput="checkReady()"></div>
        <div><label>締め切り <span class="req">必須</span></label><input id="dl" type="date" min="${todayStr()}" onchange="checkReady()" oninput="checkReady()"></div>
        <div><label>公開日時（空ならすぐ公開）</label><input id="pub" type="datetime-local"></div>
      </div>
      <div class="form-grid">
        <div><label>役職（どの役職が出すアンケートか）${ROLES.length ? ' <span class="req">必須</span>' : ""}</label>${roleSelect("role", tab !== "all" && tab !== "none" ? tab : "", "checkReady()")}</div>
        <div><label>回答の単位 <span class="req">必須</span></label><select id="unit" onchange="checkReady()"><option value="">…</option><option value="人ごと">人ごと（1人1回答）</option><option value="班ごと">班ごと（1班1回答）</option></select></div>
        <div><label>期</label>${kiSelect("kiSel", CUR_KI)}</div>
      </div>
      <div class="form-grid">
        <div><label>作成者 <span class="req">必須</span></label><input id="author" placeholder="お名前" value="${esc(localStorage.getItem(AUTHOR_KEY) || "")}" oninput="checkReady()"></div>
        <div><label>リスト外の回答</label><label class="chk"><input type="checkbox" id="guest"> 名簿にない人も回答できるようにする</label></div>
      </div>
      <div class="form-grid">
        <div><label>回答の公開</label><label class="chk"><input type="checkbox" id="secret"> 🔒 回答を非公開にする（管理者だけが見られる）</label></div>
      </div>
      <p id="needMsg" class="need">必要事項をすべて入力してください</p>
      <button class="btn" id="createBtn" onclick="createSurvey()" disabled>作成する</button>
      <p class="muted">作成すると、名前のプルダウン入りのGoogleフォームができます。完了の画面に出るリンクから、聞きたい質問を足してください。公開日時を入れた場合は、その時刻まで「公開待ち」になります（最大15分遅れます）。期は今期が最初から入っています。次の期のアンケートを先に作るときは切り替えてください。</p></div>
    <div class="panel"><h2>${tabName}回答状況</h2>
      <div class="dash">
        <div class="tile"><div class="lb">📝 受付中のアンケート</div><div class="num">${curOpen.length}<small>件</small></div><div class="sub">今期（${CUR_KI}期）の締め切り済み ${curClosedN}件</div></div>
        <div class="tile"><div class="lb">⏳ まだ全員が回答していないアンケート</div><div class="num">${notAll}<small>件</small></div><div class="sub">受付中 ${curOpen.length}件のうち</div></div>
      </div>
      <div class="filters">
        <input placeholder="🔍 アンケート名で検索" value="${esc(L.kw)}" oninput="L.kw=this.value;updateList()">
        <select onchange="L.rt=this.value;updateList()">${o("", "回答状況：すべて", L.rt)}${o("lo", "50%未満", L.rt)}${o("mid", "50〜79%", L.rt)}${o("hi", "80%以上", L.rt)}</select>
        <button class="btn gray sm" onclick="L=L0();render()">条件をクリア</button>
      </div></div>
    <div class="panel"><h2>📝 受付中・公開待ちのアンケート（${kiName}・${list.filter(s => !isClosed(s)).length}件）</h2><div id="list_open">${listHtml("open")}</div></div>
    <div class="panel past"><details ${showClosed ? "open" : ""} ontoggle="showClosed=this.open"><summary>🔒 締め切り済みのアンケート（${kiName}・${closedN}件）</summary>
      <div class="in"><div id="list_closed">${listHtml("closed")}</div></div></details></div>
    <button class="outline" onclick="reloadMaster()">👥 メンバー・班・役職をNotionから読み直す</button>
    <p class="muted" style="text-align:center">入会・退会や班替え、役職の追加をしたあとに押すと、すぐ画面に反映されます（ふだんは1日1回、自動で読み直します）。</p>`;
}
function listRows(kind){
  let rows = shown().filter(s => kind === "open" ? !isClosed(s) : isClosed(s));
  const kw = L.kw.trim();
  if(kw) rows = rows.filter(s => s.title.includes(kw));
  if(L.rt) rows = rows.filter(s => { const r = rate(s); return L.rt === "lo" ? r < 50 : L.rt === "mid" ? (r >= 50 && r < 80) : r >= 80; });
  if(kind === "open" && L.dl) rows = rows.filter(s => { const n = daysLeft(s.deadline); return n >= 0 && n <= Number(L.dl); });
  const by = {
    created: (a, b) => createdOf(a).localeCompare(createdOf(b)) || a.title.localeCompare(b.title, "ja", { numeric: true }),
    deadline: (a, b) => String(a.deadline).localeCompare(String(b.deadline)) || a.title.localeCompare(b.title, "ja", { numeric: true }),
    title: (a, b) => a.title.localeCompare(b.title, "ja", { numeric: true }),
    rate: (a, b) => rate(a) - rate(b) || a.answered - b.answered,
  };
  rows.sort(by[L[kind].sort] || by.deadline);
  if(L[kind].dir === "desc") rows.reverse();
  return rows;
}
function tagHtml(s){
  return { "受付中": '<span class="tag open">受付中</span>', "公開待ち": '<span class="tag wait">公開待ち</span>', "生成中": '<span class="tag gen">作成中…</span>',
    "エラー": '<span class="tag err">エラー</span>', "締め切り": '<span class="tag closed">締め切り</span>' }[s.status] || esc(s.status);
}
/** 各行のボタン。よく使うボタンを1つだけ出し、ほかは「その他 ▾」のメニューにまとめる */
function actsHtml(s){
  const b = (cls, fn, label) => `<button class="mini ${cls}" onclick="${fn}('${s.id}')">${label}</button>`;
  const more = `<button class="mini gray" onclick="openActMenu(event,'${s.id}')">その他 ▾</button>`;
  switch(s.status){
    case "公開待ち": return b("", "publishNow", "今すぐ公開") + more;
    case "受付中":   return b("", "openDetail", "回答一覧") + more;
    case "締め切り": return b("", "openDetail", "回答一覧") + more;
    case "エラー":   return `<span class="muted">作成に失敗しました</span>` + b("gray", "removeSurvey", "削除");
    default:         return `<button class="mini" disabled>準備中</button>` + b("gray", "removeSurvey", "削除");
  }
}
/** 「その他」メニューの中身（状態ごと） */
function actMenuItems(s){
  const it = (fn, label, cls) => ({ fn: fn, label: label, cls: cls || "" });
  const items = [];
  if(s.status === "受付中") items.push(it("copyRemind", "📋 リマインド文"));
  if((s.status === "受付中" || s.status === "公開待ち") && s.formUrl) items.push(it("formLinkModal", "🔗 フォームのURLをコピー"));
  if(s.status === "締め切り") items.push(it("reopen", "↩ 受付を再開"));
  items.push(it("editSurvey", "✏️ 編集"));
  if(s.status !== "締め切り" && s.editUrl) items.push(it("editQuestions", "📝 質問を編集"));
  items.push(it("duplicate", "📄 複製"));
  items.push("hr");
  items.push(it("removeSurvey", "🗑 削除", "danger"));
  return items;
}
/** 「その他 ▾」を押したとき、ボタンの下にメニューを開く（もう一度押すと閉じる） */
function openActMenu(ev, id){
  ev.stopPropagation();
  const cur = document.getElementById("actMenu");
  const same = cur && cur.dataset.id === id;
  closeActMenu();
  if(same) return;
  const s = find(id);
  if(!s) return;
  const m = document.createElement("div");
  m.id = "actMenu"; m.className = "actmenu"; m.dataset.id = id;
  m.innerHTML = actMenuItems(s).map(x => x === "hr" ? "<hr>"

function listHtml(kind){
  const rows = listRows(kind), st = L[kind], all = shown().filter(s => kind === "open" ? !isClosed(s) : isClosed(s)).length;
  const o = (v, t, cur) => `<option value="${v}" ${cur === v ? "selected" : ""}>${t}</option>`;
  let h = `<div class="sorts"><span class="muted">並び順</span>
      <select onchange="L.${kind}.sort=this.value;updateList()">${Object.keys(SORT_LABEL).map(k => o(k, SORT_LABEL[k], st.sort)).join("")}</select>
      <button class="btn gray sm" onclick="L.${kind}.dir=L.${kind}.dir==='asc'?'desc':'asc';updateList()">${st.dir === "asc" ? "▲ 昇順" : "▼ 降順"}</button>
      ${kind === "open" ? `<select onchange="L.dl=this.value;updateList()">${o("", "締め切りまで：すべて", L.dl)}${o("7", "締め切りまで7日以内", L.dl)}${o("30", "締め切りまで30日以内", L.dl)}</select>` : ""}
    </div><p class="hit">該当 <b>${rows.length}</b> / ${all}件</p>`;
  if(!all) return `<div class="empty">${kind === "open" ? "受付中のアンケートはありません" : "締め切り済みのアンケートはまだありません"}</div>`;
  if(!rows.length) return h + `<div class="empty">条件に合うアンケートはありません</div>`;
  if(st.sort === "created"){
    const groups = [];
    rows.forEach(s => { const m = monthOf(s); const g = groups[groups.length - 1]; if(g && g.m === m) g.rows.push(s); else groups.push({ m: m, rows: [s] }); });

  }

}

/** ひな形にタイトル・締め切り・名前を入れる。人ごとは「〇〇さん」、班ごとは「A01班」 */
function remindText(title, deadline, names, unit){
  const who = names.map(n => {
    const v = String(n).split("｜").pop();
    if(unit === "班ごと") return /班$/.test(v) ? v : v + "班";
    return v + "さん";
  }).join("、");
  return String(REMIND || REMIND_DEFAULT)
    .split("{タイトル}").join(title)
    .split("{締め切り}").join(fmtDl(deadline))
    .split("{名前}").join(who);
}
/** リマインド文をポップアップで出す。その場で直してから、ボタンで全部コピーできる */
function remindModal(msg){
  modal(`<h3 style="margin-top:0">📋 リマインド文</h3>

    <textarea id="remindBox"></textarea>
    <div style="margin-top:12px"><button class="btn" onclick="copyRemindBox()">全部コピーする</button>
    <button class="btn gray" onclick="closeModal()">閉じる</button></div>`);
  const box = document.getElementById("remindBox");
  box.value = msg;
  box.focus();
}
/** ポップアップの文章を全部コピーする */
function copyRemindBox(){

  if(navigator.clipboard) navigator.clipboard.writeText(v).then(() => toast("コピーしました")).catch(fallback);

/** 編集のポップアップを出す。回答の単位は公開待ちのときだけ選べる */
function editSurvey(id){
  const s = find(id);
  const canUnit = s.status === "公開待ち";
  const u = s.unit || "人ごと";
  modal(`<h3 style="margin-top:0">アンケートを編集</h3><p><b>${esc(s.title)}</b></p>
    <label>役職</label>${roleSelect("er", s.roleId || "")}
    <label>期</label>${kiSelect("ek", kiOf(s))}
    <label>回答の単位</label>
    <select id="eu" ${canUnit ? "" : "disabled"}>
      <option value="人ごと" ${u === "人ごと" ? "selected" : ""}>人ごと（1人1回答）</option>
      <option value="班ごと" ${u === "班ごと" ? "selected" : ""}>班ごと（1班1回答）</option></select>
    <p class="muted">${canUnit ? "回答の単位を変えると、フォームの説明文と「お名前」の注意書きも自動で直ります。" : "回答の単位は、公開したあとは変えられません。対象者と集計がずれるためです。"}</p>
    <label>リスト外の回答</label>
    <label class="chk"><input type="checkbox" id="eg" ${s.allowGuest ? "checked" : ""} ${canUnit ? "" : "disabled"}> 名簿にない人も回答できるようにする</label>
    <p class="muted">${canUnit ? "オンにすると、フォームの名前の選択肢に「リストにない方」が加わり、選んだ人は名前を書いてから質問に進みます。" : "リスト外の受け付けも、公開したあとは変えられません。"}</p>
    <label>回答の公開</label>
    <label class="chk"><input type="checkbox" id="es" ${s.secret ? "checked" : ""}> 🔒 回答を非公開にする（管理者だけが見られる）</label>
    <p class="muted">オンにすると、回答する人の画面で「回答を見る」「修正する」が出なくなり、自分の答えも他の人の答えも見られなくなります。直したい人は「答え直す」で最初から送り直します。いつでも切り替えられます。</p>
    <button class="btn" onclick="doEdit('${id}')">保存する</button> <button class="btn gray" onclick="closeModal()">キャンセル</button>`);
}
/** 編集の内容をサーバーに送る */
async function doEdit(id){
  const s = find(id);
  const p = { roleId: document.getElementById("er").value, ki: Number(document.getElementById("ek").value) || kiOf(s), secret: document.getElementById("es").checked };
  if(s.status === "公開待ち"){ p.unit = document.getElementById("eu").value; p.allowGuest = document.getElementById("eg").checked; }
  modal(`<div class="loading">保存中…</div>`);
  try {
    const r = await api("apiEditSurvey", id, p);
    closeModal();
    toast(r.changed && r.changed.length ? r.changed.join("・") + "を変更しました" : "変更はありませんでした");
    view = null; load();
  } catch(e){
    modal(`<p>保存できませんでした：${esc(errMsg(e))}</p><button class="btn gray" onclick="closeModal()">閉じる</button>`);
  }
}
// ----- CSV出力 -----
let CSV = null;
/** 表をCSVの文字にする（Excelで文字化けしないよう、先頭にBOMを付けるのはダウンロードのとき） */
function toCsv(rows){
  return rows.map(r => r.map(v => { const t = String(v ?? ""); return /[",\r\n]/.test(t) ? '"' + t.replace(/"/g, '""') + '"' : t; }).join(",")).join("\r\n");
}
/** 回答をCSVにして、ダウンロードとコピーのボタンを出す */
async function csvExport(id){
  modal(`<h3 style="margin-top:0">CSVを作っています…</h3><div class="loading">少しお待ちください</div>`);
  try {
    const r = await api("apiCsv", id);
    CSV = { filename: r.filename, text: toCsv(r.rows),
      tsv: r.rows.map(row => row.map(v => String(v ?? "").replace(/[\t\r\n]+/g, " ")).join("\t")).join("\n") };
    const n = r.rows.length - 1;
    modal(`<h3 style="margin-top:0">⬇ CSVで出力</h3>
      <p class="muted">回答した人だけの${n}件です（リスト外の回答も含みます）。ファイル名：${esc(r.filename)}</p>
      ${n ? `<textarea class="csv-box" readonly>${esc(CSV.text)}</textarea>` : `<div class="empty">まだ回答はありません</div>`}
      ${n ? `<button class="btn" onclick="csvDownload()">ファイルをダウンロード</button> <button class="btn gray" onclick="csvCopy()">全部コピーする</button> ` : ""}
      <button class="btn gray" onclick="closeModal()">閉じる</button>
      ${n ? `<p class="muted" style="margin-top:10px">ダウンロードが始まらないときは「全部コピーする」を押して、スプレッドシートに貼り付けてください。</p>` : ""}`);
  } catch(e){
    modal(`<p>CSVを作れませんでした：${esc(errMsg(e))}</p><button class="btn gray" onclick="closeModal()">閉じる</button>`);
  }
}
function csvDownload(){
  if(!CSV) return;
  try {
    const blob = new Blob(["\uFEFF" + CSV.text], { type: "text/csv;charset=utf-8" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob); a.download = CSV.filename;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 10000);
    toast("ダウンロードを始めました");
  } catch(e){ toast("ダウンロードできませんでした。「全部コピーする」を使ってください"); }
}
function csvCopy(){
  if(!CSV) return;
  const done = () => toast("コピーしました");
  // スプレッドシートにそのまま貼れるよう、タブ区切りでコピーする
  if(navigator.clipboard) navigator.clipboard.writeText(CSV.tsv).then(done).catch(fallback); else fallback();
  function fallback(){ const t = document.querySelector(".csv-box"); if(t){ t.select(); document.execCommand("copy"); done(); } }
}
load();
</script>
</body>
